  <!-- PLEASE NO CHANGES BELOW THIS LINE (UNTIL I SAY SO) -->
  <script language="javascript" type="text/javascript" src="libraries/p5.min.js"></script>
  <script language="javascript" type="text/javascript" src="BaseObjetoPista.js"></script>
  <script language="javascript" type="text/javascript" src="CerezaConCrema.js"></script>
  <script language="javascript" type="text/javascript" src="CerezaConCremaPodrida.js"></script>
  <script language="javascript" type="text/javascript" src="Frutilla.js"></script>

  <script language="javascript" type="text/javascript" src="tpfinalparte2.js"></script>
  <!-- OK, YOU CAN MAKE CHANGES BELOW THIS LINE AGAIN -->

  <!-- Processing p5.js agrega los archivos .js automáticamente; el navegador normal necesita cargarlos aquí. -->
  <script>
    const archivosPistas = [
      "BaseObjetoPista.js",
      "Huella.js",
      "Frutilla.js",
      "CerezaConCrema.js",
      "HuellaSospechosa.js",
      "FrutillaPodrida.js",
      "CerezaConCremaPodrida.js"
    ];
    const baseCargadaAutomaticamente = Array.from(document.scripts)
      .some((script) => script.src.endsWith("/BaseObjetoPista.js"));

    if (!baseCargadaAutomaticamente) {
      for (const archivo of archivosPistas) {
        document.write('<script src="' + archivo + '"><\/script>');
      }
    }
  </script>

  <style>
    html {
      min-height: 100%;
      background: #e2d3be;
    }

    body {
      padding: 0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e2d3be;
    }

    canvas {
      display: block;
    }
  </style>
</head>
